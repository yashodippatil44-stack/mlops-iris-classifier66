name: MLOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Lint
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203 --statistics

  test-suite:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Prepare data
        run: |
          mkdir -p data/raw data/processed data/features

      - name: Run data pipeline
        run: |
          python src/pipeline/collect.py
          python src/pipeline/preprocess.py
          python src/pipeline/features.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml

  model-quality-gate:
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare data
        run: |
          mkdir -p data/raw data/processed data/features

      - name: Run data pipeline
        run: |
          python src/pipeline/collect.py
          python src/pipeline/preprocess.py
          python src/pipeline/features.py

      - name: Model quality gate
        run: python -m pytest tests/test_model_quality.py -v